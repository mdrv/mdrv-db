[workspace]
resolver = "2"
members = ["crates/mdrv-db"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
fjall = "3.1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
thiserror = "2"
regex = "1"
turso = "0.7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
carapace_spec_clap = "1"
toml = "0.9"

[profile.release]
lto = "thin"
strip = "symbols"
