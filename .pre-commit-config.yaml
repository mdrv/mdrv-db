repos:
  - repo: local
    hooks:
      - id: version-check
        name: manifest versions in sync
        entry: scripts/version-check.sh
        language: system
        pass_filenames: false
      - id: yaml-parse
        name: release.yml parses
        entry: python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))'
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
      - id: bash-syntax
        name: bash -n shell scripts
        entry: bash -n
        language: system
        files: '(^scripts/.*\.sh$|PKGBUILD\.template$)'
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: '\.rs$'
      - id: clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '\.rs$'
      - id: cli-test
        name: cli-test.sh
        entry: bash scripts/cli-test.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
