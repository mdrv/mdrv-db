name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only_npm:
        description: "Build + publish only the npm side (crates/release/aur already done)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: inputs.only_npm != true
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # darwin + windows are experimental as of 0.6.1 (full platform
          # testing lands in 0.6.2); x86_64-apple-darwin cross-compiles from
          # the Apple Silicon runner (macos-13 is retired) via the shared SDK
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # cc-rs C deps (zstd-sys, mimalloc-sys, simsimd, blake3) need a musl
      # cc when building the musl targets; each runner is host-native, so
      # musl-gcc always matches the one target built there. Harmless for GNU.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check version sync (tag == crate == packages)
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$V\"" Cargo.toml
          grep -q "\"version\": \"$V\"" packages/db/package.json
          grep -q "\"version\": \"$V\"" packages/db-config/package.json
          grep -q "\"version\": \"$V\"" packages/db-events/package.json
      - uses: oven-sh/setup-bun@v2
      - name: Build console (embedded via include_dir)
        run: |
          cd packages/console
          bun install --frozen-lockfile
          bun run build
      - name: Build CLI
        # the bin requires the lib's `turso` feature (TursoPort lives there)
        run: cargo build --release --locked --target ${{ matrix.target }} -p mdrv-db --features turso
      - name: Smoke the binary
        run: |
          EXE=""
          case ${{ matrix.target }} in *windows*) EXE=.exe ;; esac
          target/${{ matrix.target }}/release/mdrv-db$EXE --version
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          T=${{ matrix.target }}
          EXE=""
          case $T in *windows*) EXE=.exe ;; esac
          B=target/$T/release/mdrv-db$EXE
          $B completion > mdrv-db.yaml
          D=mdrv-db-v$V-$T
          mkdir -p pkg/$D
          cp $B pkg/$D/mdrv-db$EXE
          cp mdrv-db.yaml README.md LICENSE pkg/$D/
          if [ -n "$EXE" ]; then
            tar -a -cf $D.zip -C pkg $D   # bsdtar: zip by extension
          else
            tar -czf $D.tar.gz -C pkg $D
          fi
          if command -v sha256sum >/dev/null 2>&1; then sha256sum $D.*; else shasum -a 256 $D.*; fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            mdrv-db-*.tar.gz
            mdrv-db-*.zip

  release:
    if: inputs.only_npm != true
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true, path: dist }
      - name: Attach installers + checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          ls | grep -v '^SHA256SUMS.txt$' | xargs sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  crates:
    if: inputs.only_npm != true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # skip when the version is already published (idempotent re-runs)
      - run: |
          V="${GITHUB_REF_NAME#v}"
          curl -fsSL -A "mdrv-db-release" "https://crates.io/api/v1/crates/mdrv-db/$V" | grep -q "\"vers\":\"$V\"" || cargo publish --locked -p mdrv-db
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-build:
    if: ${{ !cancelled() && (inputs.only_npm == true || needs.build.result == 'success') }}
    needs: build
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, suffix: linux-x64-gnu, lib: libmdrv_db_napi.so, t: "" }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-gnu, lib: libmdrv_db_napi.so, t: "" }
          # experimental as of 0.6.1; darwin-x64 cross-compiles from arm64
          - { os: macos-latest, suffix: darwin-arm64, lib: libmdrv_db_napi.dylib, t: "" }
          - { os: macos-latest, suffix: darwin-x64, lib: libmdrv_db_napi.dylib, t: x86_64-apple-darwin }
          - { os: windows-latest, suffix: win32-x64, lib: mdrv_db_napi.dll, t: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.t }}
      - uses: Swatinem/rust-cache@v2
      - name: Build napi binding (${{ matrix.suffix }})
        run: |
          OUT=target/release
          if [ -n "${{ matrix.t }}" ]; then
            cargo build --release --locked --target ${{ matrix.t }} -p mdrv-db-napi
            OUT=target/${{ matrix.t }}/release
          else
            cargo build --release --locked -p mdrv-db-napi
          fi
          cp $OUT/${{ matrix.lib }} packages/db/mdrv-db.${{ matrix.suffix }}.node
      - uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.suffix }}
          path: packages/db/*.node

  npm-publish:
    if: ${{ !cancelled() && (inputs.only_npm == true || needs.npm-build.result == 'success') }}
    needs: npm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: packages/db
      - run: |
          V=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
          npm view @mdrv/db@$V version >/dev/null 2>&1 || npm publish --access public
        working-directory: packages/db
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: |
          V=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
          npm view @mdrv/db-config@$V version >/dev/null 2>&1 || npm publish --access public
        working-directory: packages/db-config
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: |
          V=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
          npm view @mdrv/db-events@$V version >/dev/null 2>&1 || npm publish --access public
        working-directory: packages/db-events
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  aur:
    if: inputs.only_npm != true
    needs: [release, crates]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Setup system (builder user for makepkg)
        run: |
          pacman -Sy --noconfirm pacman-contrib git openssh
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
      - name: Setup SSH for AUR
        run: |
          mkdir -p /home/builder/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /home/builder/.ssh/id_ed25519
          chmod 600 /home/builder/.ssh/id_ed25519
          chown -R builder:builder /home/builder/.ssh
          ssh-keyscan -H aur.archlinux.org >> /home/builder/.ssh/known_hosts 2>/dev/null || true
      - name: Clone (or init) AUR package
        run: |
          chown -R builder:builder /home/builder
          su builder -c "GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519' \
            git clone ssh://aur@aur.archlinux.org/mdrv-db.git /home/builder/aur \
            || (git init /home/builder/aur && git -C /home/builder/aur remote add origin ssh://aur@aur.archlinux.org/mdrv-db.git)"
      - uses: actions/checkout@v7
      - name: Write PKGBUILD + .SRCINFO
        run: |
          V="${{ needs.release.outputs.version }}"
          # checksum the published crate itself (static.crates.io needs no
          # User-Agent; the API one 403s curl and gets rate-limited)
          curl -fsSL "https://static.crates.io/crates/mdrv-db/mdrv-db-$V.crate" -o /tmp/mdrv-db.crate
          CK=$(sha256sum /tmp/mdrv-db.crate | cut -d' ' -f1)
          [ -n "$CK" ] || { echo "could not download mdrv-db $V crate"; exit 1; }
          sed -e "s/@V@/$V/g" -e "s/@CK@/$CK/g" .github/aur/PKGBUILD.template > /home/builder/aur/PKGBUILD
          chown -R builder:builder /home/builder/aur
          su builder -c "cd /home/builder/aur && makepkg --printsrcinfo > .SRCINFO"
      - name: Commit + push to AUR
        run: |
          V="${{ needs.release.outputs.version }}"
          su builder -c "cd /home/builder/aur && \
            git config user.name 'Umar Alfarouk' && \
            git config user.email 'medrivia@gmail.com' && \
            git add -A && \
            { GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519' git commit -m 'updpkg: v$V' || echo 'aur: no changes for v$V'; } && \
            GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519' git push"
